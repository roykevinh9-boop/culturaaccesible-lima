spring.application.name=CulturaAccesible Lima
server.address=127.0.0.1
server.port=${CAL_HTTP_PORT:8080}
spring.datasource.url=${CAL_DB_URL:jdbc:mysql://127.0.0.1:3307/culturaaccesible?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima}
spring.datasource.username=${CAL_DB_USER:cal_app}
spring.datasource.password=${CAL_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
cal.python-url=${CAL_PYTHON_URL:http://127.0.0.1:8001}
spring.web.resources.cache.cachecontrol.no-store=true
